<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinge Hunt</title>
<meta name="description" content="Five objects a day. Tap where each one pivots, then watch the real mechanism, found by Lux3D from a single photo, open.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Dead centre: a pocket detector for suspicious objects. Lacquer housing, bone inspection window,
     mint only for revealed mechanism, vermilion for the player's tap and the score slab. */
  :root { color-scheme: dark; --lacquer: #17191c; --bone: #f2f0e7; --red: #ff4e42; --mint: #4de5d1; --silver: #b8c0c8; --ghost: #0d1b1d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--lacquer); color: var(--bone); font: 500 16px/1.35 Barlow, system-ui, sans-serif; overflow: hidden; }
  .chakra { font-family: "Chakra Petch", system-ui, sans-serif; font-weight: 700; }
  .device { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 10px; }

  /* housing */
  .hud { display: flex; align-items: center; gap: 18px; min-height: 64px; padding: 0 10px 0 18px; border-radius: 14px;
    background: linear-gradient(#262a30, #17191c 70%); box-shadow: inset 0 1px 0 #ffffff24, inset 0 -1px 0 #000, 0 1px 0 #ffffff0d; }
  .hud .name { font-size: 18px; }
  .hud .spacer { flex: 1; }
  .hud small { color: var(--silver); font-size: 15px; }

  /* inspection window: the bench drawing fills it, the object's canvas sits on the drawing */
  .window { position: relative; overflow: clip; border-radius: 18px; color: var(--bone); background: var(--lacquer); container-type: size;
    box-shadow: 0 0 0 3px #0b0c0e, 0 1px 0 4px #ffffff12; }
  /* ghost view: scanlines over the bench */
  .window::after { content: ""; position: absolute; inset: 0; z-index: 3; opacity: 0; transition: opacity .25s; pointer-events: none;
    background: repeating-linear-gradient(#4de5d10a 0 1px, transparent 1px 3px); }
  .window.ghost::after { opacity: 1; }
  .window.shake { animation: shake .28s cubic-bezier(.3, .7, .4, 1); }
  @keyframes shake { 20% { transform: translate(-7px, 4px); } 45% { transform: translate(5px, -3px); } 70% { transform: translate(-2px, 1px); } }
  /* the bench fills the window's width, or is cropped round the turntable on a tall phone */
  .stage { position: absolute; left: 50%; top: 52%; z-index: 1; aspect-ratio: 640 / 480; width: max(100cqw, min(133.3cqh, 230cqw)); transform: translate(-48%, -60%); }
  .stage > svg, .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage > canvas { touch-action: none; }
  .aiming canvas { cursor: none; }

  /* viewfinder corners */
  .finder { position: absolute; inset: 14px; z-index: 2; pointer-events: none; }
  .finder i { position: absolute; width: 28px; height: 28px; border: 0 solid #ffffff33; transition: border-color .25s; }
  .finder i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; }
  .finder i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; }
  .finder i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; }
  .finder i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; }
  .ghost .finder i { border-color: #4de5d199; }

  /* reticle: follows the pointer, red over the object, contracts when it locks */
  #reticle { position: absolute; left: 0; top: 0; z-index: 4; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; color: var(--bone); }
  #reticle svg { width: 100%; height: 100%; overflow: visible; transition: transform .12s, color .12s; }
  #reticle.on { color: var(--red); }
  #reticle.on svg { transform: rotate(45deg) scale(.86); }
  #reticle.lock { color: var(--red); }
  #reticle.lock svg { transform: rotate(45deg) scale(.5); }
  #reticle.nope { animation: nope .3s; }
  @keyframes nope { 25% { margin-left: -34px; } 50% { margin-left: -22px; } 75% { margin-left: -31px; } }
  [data-part^="drawer"] { transition: transform .45s cubic-bezier(.3, .8, .3, 1); }
  .stage > canvas { cursor: grab; }
  .stage > canvas:active { cursor: grabbing; }

  /* round intro: a case-file band sweeps across */
  #intro { position: absolute; left: -6%; right: -6%; top: 36%; z-index: 5; padding: 18px 9% 22px; transform: translateX(110%) rotate(-4deg);
    background: var(--lacquer); color: var(--bone); border-left: 18px solid var(--red); box-shadow: 0 14px 30px #00000040; pointer-events: none; }
  #intro small { display: block; font: 700 18px "Chakra Petch"; color: var(--silver); }
  #intro b { display: inline-block; font-size: clamp(44px, 8vw, 104px); line-height: 1; }
  #intro b::first-letter { text-transform: uppercase; }
  #intro.go { animation: band 1.05s cubic-bezier(.3, .8, .3, 1) both; }
  @keyframes band { 0% { transform: translateX(110%) rotate(-4deg); } 24%, 76% { transform: translateX(0) rotate(-4deg); } 100% { transform: translateX(-115%) rotate(-4deg); } }

  /* question: the part name in a red block */
  .ask mark { display: inline-block; background: var(--red); color: var(--lacquer); padding: 0 .16em .04em; margin: .04em 0; transform: rotate(-2deg); }

  /* result pips */
  .pips { display: flex; gap: 5px; }
  .pips i { width: 26px; height: 12px; border-radius: 3px; background: #2c3036; box-shadow: inset 0 1px 0 #ffffff14; }
  .pips i.now { background: var(--bone); }
  .pips i.hit { background: var(--mint); }
  .pips i.near { background: var(--silver); }
  .pips i.miss { background: var(--red); }

  .screen { position: absolute; inset: 0; z-index: 2; pointer-events: none; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .screen > * { pointer-events: auto; }
  .screen .spacer { flex: 1; pointer-events: none; }
  .ask { margin: 0; font-size: clamp(28px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.01em; max-width: 16ch; text-wrap: balance; }
  .hint { margin: 0; font-size: 18px; color: var(--silver); max-width: 60ch; }
  #end { overflow-y: auto; } /* five rows can outgrow a short phone */
  .ghost .hint { color: var(--silver); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* buttons: physical keys that depress */
  .btn { font: 700 17px "Chakra Petch", system-ui; padding: 14px 22px; border: 0; border-radius: 12px; cursor: pointer; color: var(--bone);
    background: linear-gradient(#2c3036, #17191c); box-shadow: inset 0 1px 0 #ffffff2e, 0 4px 0 #000; transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 1px 0 #ffffff2e, 0 1px 0 #000; }
  .btn.go { color: var(--lacquer); background: linear-gradient(#ff7067, #f0402f); box-shadow: inset 0 1px 0 #ffffff66, 0 4px 0 #9a2219; }
  .btn.go:active { box-shadow: inset 0 1px 0 #ffffff66, 0 1px 0 #9a2219; }
  .btn.light { color: var(--lacquer); background: linear-gradient(#ffffff, #dedbd0); box-shadow: inset 0 1px 0 #fff, 0 4px 0 #8d8a80; }
  .btn.quiet { padding: 10px 14px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

  /* title: two enamel plates joined by a hinge pin */
  .plates { display: flex; align-items: stretch; perspective: 900px; align-self: flex-start; }
  .plate { font-size: clamp(44px, 9vw, 120px); line-height: 1; padding: .12em .3em .16em; color: var(--bone);
    background: linear-gradient(#2c3036, #17191c 75%); box-shadow: inset 0 2px 0 #ffffff2e, inset 0 -3px 0 #000, 0 10px 24px #0000004d;
    transition: transform .45s cubic-bezier(.5, 0, .7, .2), opacity .45s; }
  .plate.l { border-radius: 14px 4px 4px 14px; transform-origin: right center; }
  .plate.r { border-radius: 4px 14px 14px 4px; transform-origin: left center; color: var(--red); }
  .pin { width: 14px; border-radius: 7px; margin: -6px -3px; position: relative; z-index: 1;
    background: linear-gradient(90deg, #6d747b, #e9eef2 40%, #8a939b 70%, #4c5258); box-shadow: 0 0 0 2px #0b0c0e; }
  .plates.open .l { transform: rotateY(-95deg); opacity: 0; }
  .plates.open .r { transform: rotateY(95deg); opacity: 0; }
  .lede { margin: 0; font-size: clamp(18px, 2vw, 22px); font-weight: 600; }
  .challenge { margin: 0; align-self: flex-start; background: var(--lacquer); color: var(--bone); padding: 8px 14px; border-radius: 8px; font-weight: 600; }

  /* reveal: the angled score slab clips onto the frame */
  .slab { position: absolute; left: -14px; bottom: 96px; transform: rotate(-5deg); transform-origin: left bottom; pointer-events: none; }
  .slab b { display: block; width: max-content; font-size: clamp(76px, 13vw, 168px); line-height: .9; padding: 8px 48px 14px 34px; color: var(--lacquer);
    background: var(--red); clip-path: polygon(0 0, 100% 7%, 95% 100%, 0 93%); font-variant-numeric: tabular-nums; }
  .slab span { display: block; width: max-content; max-width: min(78vw, 560px); margin: -4px 0 0 30px; padding: 9px 16px; background: var(--bone); color: var(--lacquer);
    font: 600 18px/1.3 Barlow; transform: rotate(3deg); }
  .slab.in { animation: slam .34s cubic-bezier(.2, 1.5, .4, 1) both; }
  .slab.perfect b { background: linear-gradient(105deg, var(--red) 42%, #ffd2cc 50%, var(--red) 58%) 100% 0 / 320% 100%; animation: sheen .9s .3s both; }
  @keyframes slam { from { transform: translateX(-105%) rotate(-14deg); } to { transform: rotate(-5deg); } }
  @keyframes sheen { to { background-position: 0 0; } }
  .reveal-bar { justify-content: flex-end; }

  /* end: case closed */
  .case { align-self: center; margin: auto 0; width: min(100%, 560px); padding: 26px; border-radius: 18px; color: var(--bone);
    background: linear-gradient(#262a30, #111316); box-shadow: inset 0 1px 0 #ffffff26, 0 18px 40px #0000004d; display: flex; flex-direction: column; gap: 16px; }
  .case h2 { margin: 0; font-size: 20px; color: var(--silver); }
  .total { font-size: clamp(72px, 12vw, 120px); line-height: .85; font-variant-numeric: tabular-nums; }
  .total small { font-size: .3em; color: var(--silver); }
  .rows { display: grid; gap: 6px; }
  .rows div { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 6px; border-radius: 10px; background: #ffffff0a; }
  .rows img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--ghost); display: block; }
  .rows span::first-letter { text-transform: uppercase; }
  .rows b { font: 700 24px "Chakra Petch"; font-variant-numeric: tabular-nums; padding-right: 8px; }
  .rows b.hit { color: var(--mint); }
  .rows div { animation: rise .3s cubic-bezier(.2, 1.2, .4, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .case { position: relative; }
  .stamp { position: absolute; top: 18px; right: 22px; display: grid; place-items: center; width: 108px; height: 108px; border: 5px solid var(--red); border-radius: 14px;
    color: var(--red); transform: rotate(10deg); animation: stamp .32s cubic-bezier(.3, 1.6, .5, 1) both; }
  .stamp b { font-size: 64px; line-height: .8; }
  .stamp small { font: 700 13px "Chakra Petch"; margin-top: -14px; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(2.4); } }

  /* make: stages listed with their state as a word */
  .stages { display: grid; gap: 6px; max-width: 440px; margin: 0; padding: 0; list-style: none; }
  .stages li { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 10px; background: #17191c14; font-weight: 600; }
  .stages li.now { background: var(--lacquer); color: var(--bone); }
  .stages li em { font-style: normal; color: #6b6e73; }
  .stages li.now em { color: var(--mint); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
  @media (max-width: 600px) {
    .device { padding: 6px; gap: 6px; }
    .hud { gap: 10px; padding: 0 6px 0 12px; min-height: 58px; }
    .hud .name { display: none; }
    .screen { padding: 16px; }
    .slab { bottom: 84px; }
  }
</style>

<main class="device">
  <header class="hud">
    <span class="name chakra">Hinge Hunt</span>
    <small id="hudObj"></small>
    <span class="pips" id="pips"></span>
    <span class="spacer"></span>
    <button class="btn quiet" id="snd">Sound on</button>
  </header>

  <div class="window" id="win">
    <div class="stage iso hh-bench" id="stage"></div>
    <div class="finder"><i></i><i></i><i></i><i></i></div>
    <div id="reticle" hidden><svg viewBox="-28 -28 56 56" fill="none" stroke="currentColor" stroke-width="3"><circle r="15"/><path d="M0-27v9M0 18v9M-27 0h9M18 0h9"/><circle r="2.5" fill="currentColor" stroke="none"/></svg></div>
    <div id="intro"><small id="introOf"></small><b class="chakra" id="introName"></b></div>
    <section class="screen" id="title">
      <div class="plates chakra" id="plates"><span class="plate l">Hinge</span><i class="pin"></i><span class="plate r">Hunt</span></div>

      <p class="challenge" id="challenge" hidden></p>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn go" id="play">Start today's hunt</button>
        <label class="btn"><input class="photo" type="file" accept="image/*" hidden>Add your own object</label>
      </div>
    </section>

    <section class="screen" id="round" hidden>
      <h2 class="ask chakra" id="ask"></h2>
      <div class="spacer"></div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="screen" id="reveal" hidden>
      <div class="slab" id="slab"><b class="chakra" id="gain"></b><span id="verdict"></span></div>
      <div class="spacer"></div>
      <div class="row reveal-bar"><button class="btn light" id="next" hidden>Next object</button></div>
    </section>

    <section class="screen" id="end" hidden>
      <div class="case">

        <h2 class="chakra">Case closed</h2>
        <div class="total chakra" id="total"></div>
        <div class="rows" id="rows"></div>
        <div class="row">
          <button class="btn go" id="share">Beat my score</button>
          <label class="btn"><input class="photo" type="file" accept="image/*" hidden>Add your own object</label>
        </div>
      </div>
    </section>

    <section class="screen" id="make" hidden>
      <h2 class="ask chakra" id="makeAsk"></h2>
      <ol class="stages" id="stages"></ol>
      <p class="hint" id="makeHint"></p>
      <div class="spacer"></div>
      <div class="row" id="reviewRow" hidden>
        <button class="btn go" id="yes">Yes, publish it</button>
        <button class="btn" id="flip">Flip the direction</button>
        <button class="btn" id="no">Discard</button>
      </div>
      <div class="row" id="madeRow" hidden>
        <button class="btn go" id="playMine">Play it</button>
        <button class="btn" id="copyMine">Copy the link</button>
      </div>
    </section>
  </div>
</main>

const WARM = new THREE.Color(1, 0.8, 0.55), UV = new THREE.Color(0.3, 0.95, 0.85);
const pool = new THREE.Mesh(new THREE.CircleGeometry(TT.R - 1.5, 96), new THREE.ShaderMaterial({
  uniforms: { uColor: { value: WARM.clone() }, uGain: { value: 0.2 }, uAt: { value: poolAt }, uMid: { value: new THREE.Vector2(platter.x, platter.y) }, uR: { value: TT.R } },
  vertexShader: "varying vec2 vP;void main(){vec4 w=modelMatrix*vec4(position,1.);vP=w.xy;gl_Position=projectionMatrix*viewMatrix*w;}",
  fragmentShader: `uniform vec3 uColor;uniform float uGain;uniform vec2 uAt;uniform vec2 uMid;uniform float uR;varying vec2 vP;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){float d=length(vP-uAt)/(uR*.78);float f=exp(-d*d*2.)*(1.-smoothstep(uR-16.,uR-3.,length(vP-uMid)));
vec3 c=uColor*uGain*f+(h(gl_FragCoord.xy)-.5)/255.;gl_FragColor=vec4(max(c,0.),0.);}`,
  transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
}));
pool.position.copy(platter).add(new THREE.Vector3(0, 0, 0.05));
scene.add(pool);
// spin turns with the platter; fix stands a y-up glTF upright (z-up) at bench scale
const spinner = new THREE.Group(), lift = new THREE.Group(), fix = new THREE.Group(), centre = new THREE.Group();
spinner.position.copy(platter);
fix.rotation.x = Math.PI / 2;
spinner.add(lift);
lift.add(fix);
fix.add(centre);
scene.add(spinner);
const GHOST = new THREE.MeshStandardMaterial({ color: 0x1f3a3b, metalness: 0.55, roughness: 0.32 });
const loader = new GLTFLoader();
const nums = (el, attr, d = "0 0 0") => (el?.getAttribute(attr) ?? d).trim().split(/\s+/).map(Number);
let obj = null, marks = [], swing = null, spin = false, grow = null, turn = 0, fling = 0, dragging = false;
const still = matchMedia("(prefers-reduced-motion: reduce)");
// Small tween runner, stepped by the render loop. Reduced motion jumps to the end.
const tweens = new Set();
const ease = { out: t => 1 - (1 - t) ** 3, in: t => t * t * t,
  bounce: t => { const n = 7.5625, d = 2.75; return t < 1 / d ? n * t * t : t < 2 / d ? n * (t -= 1.5 / d) * t + 0.75 : t < 2.5 / d ? n * (t -= 2.25 / d) * t + 0.9375 : n * (t -= 2.625 / d) * t + 0.984375; } };
const tween = (ms, fn, curve = ease.out) => new Promise(done => tweens.add({ t0: performance.now(), ms: still.matches ? 0 : ms, fn, curve, done }));
// The object is lifted off the platter and the next one drops onto it.
const LIFT = 190;
async function takeAway() { if (!obj) return; await tween(240, e => (lift.position.z = e * LIFT), ease.in); obj.group.visible = false; }
async function setDown() { lift.position.z = LIFT; await tween(620, e => (lift.position.z = LIFT * (1 - e)), ease.bounce); }
function ghostLight(on) {
  const u = pool.material.uniforms, from = u.uColor.value.clone(), to = on ? UV : WARM, g0 = u.uGain.value, g1 = on ? 0.26 : 0.2;
  tween(300, e => { u.uColor.value.copy(from).lerp(to, e); u.uGain.value = g0 + (g1 - g0) * e; });
}

function resize() {
  const r = stage.getBoundingClientRect();
  if (!r.width) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(r.width, r.height, false);
}
new ResizeObserver(resize).observe(stage);

// ---------- instruments ----------
// Turntable ticks turn with the platter (radialTicks' angles run clockwise seen from above, three's the other way).
function setTurn(a) {
  turn = a;
  spinner.rotation.z = a;
  const t = K.radialTicks(TT.x, TT.y, TT.R - 1.2, 72, 6, TT.top, [2.2, 4.6], P, -a);
  const [minor, major] = parts("ttTicks").children;
  minor.setAttribute("d", t.minor);
  major.setAttribute("d", t.major);
}
const dialNeedle = (d, share, from = 0, span = Math.PI * 2) => {
  const a = from + share * span;
  return K.lineOnTop([d.x - Math.sin(a) * 3, d.y + Math.cos(a) * 3], [d.x + Math.sin(a) * (d.R - 3.6), d.y - Math.cos(a) * (d.R - 3.6)], d.z + 0.2, P);
};
const setTimer = share => parts("timerNeedle").setAttribute("d", dialNeedle(B.TIMER, share));
// the dial indicator reads the miss: full scale is 30% of the object's size, where a tap earns nothing
let gaugeAt = 0;
const setGauge = share => (gaugeAt = share, parts("gaugeNeedle")).setAttribute("d", dialNeedle(B.GAUGE_DIAL, Math.min(1, Math.max(0, share)), -Math.PI * 0.75, Math.PI * 1.5));
function setCounter(n) { String(Math.min(999, n)).padStart(3, "0").split("").forEach((d, i) => (parts(`digit${i}`).textContent = d)); }
// drawer i slides out toward the viewer when its object is on the turntable; its tab shows the result
const drawerOut = K.axisVector(P, [0, 18, 0]);
function setDrawers(open, done = []) {
  for (let i = 0; i < B.RACK.drawers; i++) {
    const g = parts(`drawer${i}`);
    g.style.transform = i === open ? `translate(${drawerOut[0]}px, ${drawerOut[1]}px)` : "";
    const r = done[i];
    parts(`tab${i}`).style.fill = !r ? "none" : r.gain >= 75 ? "var(--mint)" : r.gain >= 30 ? "var(--silver)" : "var(--red)";
  }
}

const zips = {};
const fetchZip = id => (zips[id] ??= fetch(`/f/${id}/model.zip`).then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error(r.status))));
// Round details and unpacked objects are cached by id, so the next object is ready before it is needed.
const roundInfo = {}, prepared = {};
const getRound = id => (roundInfo[id] ??= api(`/api/rounds/${id}`).catch(err => { delete roundInfo[id]; throw err; }));
const prepare = id => (prepared[id] ??= getRound(id).then(loadFresh).catch(err => { delete prepared[id]; throw err; }));
// Model downloads sometimes arrive cut short; a cut ZIP fails to unzip, so drop it and fetch again.
async function loadFresh(round) {
  for (let i = 0; ; i++) {
    try { return await loadObject(round); }
    catch (err) { delete zips[round.id]; if (i === 2) throw err; }
  }
}

// URDF tree: a child link's frame sits at its joint origin; its mesh is expressed in that frame.
async function loadObject(round) {
  const files = unzipSync(new Uint8Array(await fetchZip(round.id)));
  const urdfPath = Object.keys(files).find(f => f.endsWith(".urdf"));
  const dir = urdfPath.slice(0, urdfPath.lastIndexOf("/") + 1);
  const urdf = new DOMParser().parseFromString(new TextDecoder().decode(files[urdfPath]), "text/xml");
  const links = {}, children = new Set(), joints = [];
  for (const l of urdf.querySelectorAll("link")) {
    const g = new THREE.Group(), mesh = l.querySelector("mesh");
    if (mesh) g.add((await loader.parseAsync(files[dir + mesh.getAttribute("filename")].slice().buffer, "")).scene);
    links[l.getAttribute("name")] = g;
  }
  for (const j of urdf.querySelectorAll("joint")) {
    const o = j.querySelector("origin"), lim = j.querySelector("limit"), part = j.querySelector("child").getAttribute("link");
    const frame = new THREE.Group(), move = new THREE.Group();
    frame.position.set(...nums(o, "xyz"));
    frame.rotation.set(...nums(o, "rpy"));
    move.add(links[part]);
    frame.add(move);
    links[j.querySelector("parent").getAttribute("link")].add(frame);
    children.add(part);
    if (j.getAttribute("type") !== "revolute" && j.getAttribute("type") !== "continuous") continue;
    const lower = +(lim?.getAttribute("lower") ?? -Math.PI), upper = +(lim?.getAttribute("upper") ?? Math.PI);
    const closed = Math.min(Math.max(0, lower), upper);
    let dir1 = Math.abs(upper - closed) >= Math.abs(lower - closed) ? 1 : -1;
    if (round.flip) dir1 = -dir1;
    const reach = Math.min(MAX_SWING, Math.max(Math.abs(upper - closed), Math.abs(lower - closed)));
    joints.push({ part, frame, move, closed, swing: dir1 * reach, range: upper - lower,
      axis: new THREE.Vector3(...nums(j.querySelector("axis"), "xyz", "1 0 0")).normalize() });
  }
  const group = new THREE.Group();
  for (const [n, g] of Object.entries(links)) if (!children.has(n)) group.add(g);
  const joint = [...joints].sort((a, b) => b.range - a.range)[0]; // ask about the hinge that swings furthest
  return { group, joints, joint };
}

function setPose(s) { for (const j of obj.joints) j.move.quaternion.setFromAxisAngle(j.axis, j.closed + s * j.swing); }

function clearMarks() { for (const m of marks) m.removeFromParent(); marks = []; grow = null; }
// The object keeps its own coordinates (taps, guesses and the hinge are stored in them); only its holder moves.
function place(o) {
  if (obj) obj.group.removeFromParent();
  clearMarks();
  swing = null; // a new object arrives closed
  obj = o;
  setPose(1);
  const box = new THREE.Box3().setFromObject(o.group);
  setPose(0);
  const closed = new THREE.Box3().setFromObject(o.group);
  o.diag = closed.getSize(new THREE.Vector3()).length(); // scoring scale: the closed object
  o.hinge = hingeSegment(o); // measured before it is parented, so in its own coordinates
  box.union(closed);
  const size = box.getSize(new THREE.Vector3()), c = closed.getCenter(new THREE.Vector3());
  fix.scale.setScalar(Math.min((TT.R * 1.5) / Math.hypot(size.x, size.z), 130 / size.y));
  centre.position.set(-c.x, -closed.min.y, -c.z);
  o.group.traverse(m => { if (m.isMesh) m.castShadow = true; });
  centre.add(o.group);
  setTurn(0);
}

function overlay(m) { m.renderOrder = 2; obj.group.add(m); marks.push(m); return m; }
function mark(p, color, size) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(obj.diag * 0.014 * size), new THREE.MeshBasicMaterial({ color, depthTest: false }));
  m.position.copy(p);
  return overlay(m);
}
function line(a, b) {
  return overlay(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color: css("--bone"), depthTest: false })));
}
// The hinge is a line, not a point: the joint axis, clipped to the moving part's extent along it.
function hingeSegment(o) {
  o.group.updateMatrixWorld(true);
  const j = o.joint;
  const origin = j.frame.getWorldPosition(new THREE.Vector3());
  const dir = j.axis.clone().applyQuaternion(j.frame.getWorldQuaternion(new THREE.Quaternion())).normalize();
  const box = new THREE.Box3().setFromObject(j.move);
  let lo = Infinity, hi = -Infinity;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const t = new THREE.Vector3(x, y, z).sub(origin).dot(dir);
    lo = Math.min(lo, t); hi = Math.max(hi, t);
  }
  return [origin.clone().addScaledVector(dir, lo), origin.clone().addScaledVector(dir, hi)];
}
function nearestOn([a, b], p) {
  const ab = b.clone().sub(a);
  const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return a.clone().addScaledVector(ab, t);
}
function rod(a, b) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(obj.diag * 0.008, obj.diag * 0.008, a.distanceTo(b), 12), new THREE.MeshBasicMaterial({ color: css("--mint"), depthTest: false }));
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return overlay(m);
}
const partName = o => o.joint.part.replace(/_/g, " ").replace(/\d+/g, "").trim();

// Ghost view as an x-ray: fixed parts go dark, the part that moves keeps its texture and lights up mint.
function xray(on) {
  const moving = new Set();
  obj.joint.move.traverse(m => moving.add(m));
  obj.group.traverse(m => {
    if (!m.isMesh) return;
    m.userData.orig ??= m.material;
    if (!on) return void (m.material = m.userData.orig);
    if (moving.has(m)) {
      m.userData.lit ??= Object.assign(m.userData.orig.clone(), { emissive: new THREE.Color(css("--mint")), emissiveIntensity: 0.32 });
      m.material = m.userData.lit;
    } else m.material = GHOST;
  });
}

// Result pips in the housing: one per object, coloured by how close the tap was.
function pips() {
  $("pips").innerHTML = run.map((_, i) => {
    const r = results[i];
    return `<i class="${!r ? (i === at ? "now" : "") : r.gain >= 75 ? "hit" : r.gain >= 30 ? "near" : "miss"}"></i>`;
  }).join("");
}

// Reticle: follows the pointer over the window while a round is live; red when it is over the object.
const reticle = $("reticle");
function aimAt(e) {
  const r = win.getBoundingClientRect();
  reticle.style.transform = `translate(${e.clientX - r.left}px, ${e.clientY - r.top}px)`;
  const c = renderer.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - c.left) / c.width) * 2 - 1, -((e.clientY - c.top) / c.height) * 2 + 1), camera);
  reticle.classList.toggle("on", !!ray.intersectObject(obj.group, true)[0]);
}
renderer.domElement.addEventListener("pointermove", e => { if (tapHandler && obj) { reticle.hidden = false; aimAt(e); } });
renderer.domElement.addEventListener("pointerleave", () => { if (tapHandler) reticle.hidden = true; });

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (obj && swing !== null) setPose((1 - Math.cos((t - swing) / 650)) / 2);
  if (spin) setTurn(turn + dt * 0.35); // the title turns the platter slowly
  else if (!dragging && Math.abs(fling) > 0.01) { setTurn(turn + fling * dt); fling *= Math.exp(-dt * 3.5); } // a flung platter coasts to a stop
  for (const tw of tweens) {
    const k = tw.ms ? Math.min(1, (t - tw.t0) / tw.ms) : 1;
    tw.fn(tw.curve(Math.max(0, k)));
    if (k >= 1) { tweens.delete(tw); tw.done(); }
  }
  if (grow) grow.mesh.scale.y = Math.max(0.001, Math.min(1, (t - grow.t0) / 250)); // the hinge line draws in
  renderer.render(scene, camera);
});

// A small picture of the reveal for the case-closed rows.
function snapshot() {
  renderer.render(scene, camera);
  const c = document.createElement("canvas"), s = renderer.domElement;
  c.width = 128; c.height = 96;
  const g = c.getContext("2d"), k = Math.max(c.width / s.width, c.height / s.height);
  g.fillStyle = css("--ghost");
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(s, (c.width - s.width * k) / 2, (c.height - s.height * k) / 2, s.width * k, s.height * k);
  return c.toDataURL("image/jpeg", 0.8);
}

// ---------- the run ----------
let run = [], at = 0, total = 0, results = [], tapHandler = null, started = 0, timerId;

// Drag across the bench to turn the platter; a tap without a drag is the guess.
let down, dragFrom = null;
const rayAt = e => {
  const r = renderer.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  return ray;
};
let lastMove = 0;
renderer.domElement.addEventListener("pointerdown", e => {
  down = [e.clientX, e.clientY];
  dragFrom = e.clientX;
  dragging = true;
  fling = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
  if (tapHandler && obj) { reticle.hidden = false; aimAt(e); }
});
renderer.domElement.addEventListener("pointermove", e => {
  if (dragFrom === null || !obj) return;
  const step = (e.clientX - dragFrom) * 0.012, now = performance.now();
  setTurn(turn + step);
  fling = step / Math.max(0.008, (now - lastMove) / 1000);
  lastMove = now;
  dragFrom = e.clientX;
  spin = false;
});
renderer.domElement.addEventListener("pointerup", e => {
  dragFrom = null;
  dragging = false;
  if (performance.now() - lastMove > 80) fling = 0; // released while still: no coast
  if (!tapHandler || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const hit = rayAt(e).intersectObject(obj.group, true)[0];
  if (hit) return tapHandler(obj.group.worldToLocal(hit.point.clone()));
  // a tap beside the object: the reticle shakes it off
  reticle.classList.remove("nope");
  void reticle.offsetWidth;
  reticle.classList.add("nope");
  sfx.tick();
});
// Keys: Enter or Space presses the main button, arrows turn the platter.
addEventListener("keydown", e => {
  if (e.target.closest?.("button, label, input")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { fling = e.key === "ArrowLeft" ? -2.4 : 2.4; spin = false; return; }
  if (e.key !== "Enter" && e.key !== " ") return;
  const go = [...document.querySelectorAll(".screen:not([hidden]) .btn.go, .screen:not([hidden]) .btn.light")].find(b => !b.hidden && b.offsetParent);
  if (go) { e.preventDefault(); go.click(); }
});

async function startRun(ids) {
  run = ids; at = 0; total = 0; results = [];
  spin = false;
  await playRound();
}

async function playRound() {
  const id = run[at];
  win.classList.remove("ghost");
  show("round");
  reticle.hidden = true;
  reticle.className = "";
  $("ask").textContent = "";
  const slow = setTimeout(() => ($("ask").textContent = "Loading the object…"), 400); // only when the next object really is late
  $("hint").textContent = "";
  hud("");
  pips();
  parts("timerNeedle").dataset.tone = "lit";
  setTimer(0);
  const was = gaugeAt;
  tween(400, e => setGauge(was * (1 - e)));
  setCounter(total);
  setDrawers(at, results);
  ghostLight(false);
  const [round] = await Promise.all([getRound(id), obj?.id === id ? null : takeAway()]);
  try {
    if (obj?.id !== id) {
      place(await prepare(id));
      delete prepared[id]; // a placed object is used up; a replay prepares a fresh one
      obj.id = id;
      await setDown();
      sfx.thunk();
    } else { // the title's object is already on the platter: bring it round to the front the short way
      const from = Math.atan2(Math.sin(turn), Math.cos(turn));
      tween(500, e => setTurn(from * (1 - e)));
    }
    spin = false;
  }
  catch {
    clearTimeout(slow);
    $("ask").textContent = "This object didn't load. Skipping it.";
    results.push({ name: round.name || "your object", gain: 0 });
    await wait(1800);
    return ++at < run.length ? playRound() : finish();
  }
  clearTimeout(slow);
  swing = null;
  if (run[at + 1]) prepare(run[at + 1]); // the next object is fetched and unpacked while this one is played
  // Intro band: which object this is, then the question and the clock.
  $("ask").textContent = "";
  $("introOf").textContent = `Object ${at + 1} of ${run.length}`;
  $("introName").textContent = round.name || "Your object";
  $("intro").className = "";
  void $("intro").offsetWidth; // restart the animation
  $("intro").className = "go";
  sfx.whoosh();
  await wait(1000);
  const part = document.createElement("mark");
  part.textContent = partName(obj);
  $("ask").replaceChildren("Where does the ", part, " pivot?");
  $("hint").textContent = "Tap the spot. Drag to turn it.";
  win.classList.add("aiming");
  started = performance.now();
  let shown = ROUND_SECONDS;
  const tick = () => {
    const left = 1 - (performance.now() - started) / 1000 / ROUND_SECONDS;
    setTimer(Math.min(1, 1 - left) * ROUND_SECONDS / 60); // the timer's face is 60 s around; 15 s is a quarter turn
    const secs = Math.max(0, Math.ceil(left * ROUND_SECONDS));
    if (secs !== shown) {
      shown = secs;
      if (secs <= 3 && secs > 0) { parts("timerNeedle").dataset.tone = "red"; sfx.tick(); } // the last three seconds
    }
    if (left <= 0) return answer(null, round);
    timerId = requestAnimationFrame(tick);
  };
  timerId = requestAnimationFrame(tick);
  tapHandler = p => answer(p, round);
}

// Closeness: 1 on the real pivot, 0 at 30% of the object's size away. Points: 80 for closeness + up to 20 for speed.
// The reveal runs as one sequence: tap locks, window flips to ghost view, hinge draws, part opens, score slams in.
async function answer(p, round) {
  tapHandler = null;
  cancelAnimationFrame(timerId);
  sfx.click();
  const hinge = obj.hinge;
  const pivot = p ? nearestOn(hinge, p) : hinge[0];
  const secs = (performance.now() - started) / 1000;
  const close = p ? Math.max(0, 1 - p.distanceTo(pivot) / (0.3 * obj.diag)) : 0;
  const gain = Math.round(80 * close + 20 * close * Math.max(0, 1 - secs / ROUND_SECONDS));
  total += gain;
  results.push({ name: round.name || "your object", gain });
  const crowd = p
    ? api(`/api/rounds/${round.id}/guesses`, { method: "POST", body: JSON.stringify({ p: p.toArray(), score: close * 100 }) }).then(g => g.slice(0, -1), () => [])
    : Promise.resolve(round.guesses || []);
  win.classList.remove("aiming");
  if (p) { reticle.classList.add("lock"); mark(p, css("--red"), 1); } else reticle.hidden = true;
  show("reveal");
  $("slab").className = "slab";
  $("slab").hidden = true;
  $("next").hidden = true;

  await wait(150);
  reticle.hidden = true;
  win.classList.add("ghost");
  ghostLight(true);
  xray(true);
  grow = { mesh: rod(...hinge), t0: performance.now() };
  sfx.chirp();

  await wait(250);
  if (p) line(p, pivot);
  swing = performance.now();
  sfx.snap();

  const others = await crowd;
  await wait(650);
  for (const g of others.slice(-60)) mark(new THREE.Vector3(...g.p), css("--silver"), 0.5);
  const beat = others.filter(g => g.score < close * 100).length;
  $("verdict").textContent = !p ? "Too slow. It pivots on the green line."
    : (close > 0.75 ? "On the hinge." : close > 0.3 ? "Close." : "It pivots on the green line.")
      + (others.length ? ` ${beat} of ${others.length} ${others.length === 1 ? "player was" : "players were"} further off.` : " You're the first to play this one.");
  $("slab").hidden = false;
  $("slab").className = "slab in" + (gain >= 90 ? " perfect" : "");
  if (gain >= 40) { win.classList.remove("shake"); void win.offsetWidth; win.classList.add("shake"); }
  sfx.reward(close);
  pips();
  setDrawers(at, results);
  // The dial indicator swings to the miss while the score and the counter count up.
  const miss = p ? p.distanceTo(pivot) / (0.3 * obj.diag) : 1;
  const t0 = performance.now();
  const count = () => {
    const k = Math.min(1, (performance.now() - t0) / 450), e = 1 - (1 - k) ** 3;
    $("gain").textContent = `+${Math.round(gain * k)}`;
    setGauge(miss * e);
    setCounter(total - gain + Math.round(gain * k));
    if (k < 1) requestAnimationFrame(count);
  };
  count();
  $("next").textContent = at + 1 < run.length ? "Next object" : "See your score";
  $("next").hidden = false;
}

$("next").onclick = () => {
  sfx.click();
  results[at].thumb = snapshot();
  ++at < run.length ? playRound() : finish();
};

function finish() {
  show("end");
  win.classList.remove("ghost");
  hud("");
  pips();
  swing = null;
  ghostLight(false);
  const leaving = obj;
  obj = null; // the object is lifted off the platter as the case closes
  if (leaving) tween(240, e => (lift.position.z = e * LIFT), ease.in).then(() => leaving.group.removeFromParent());
  clearMarks();
  const max = run.length * 100, share = total / max;
  const t0 = performance.now();
  const count = () => {
    const k = Math.min(1, (performance.now() - t0) / 700);
    $("total").innerHTML = `${Math.round(total * k)}<small> / ${max}</small>`;
    if (k < 1) requestAnimationFrame(count);
  };
  count();
  $("rank").hidden = true;
  setTimeout(() => {
    $("rankLetter").textContent = share >= 0.85 ? "S" : share >= 0.65 ? "A" : share >= 0.4 ? "B" : "C";
    $("rank").hidden = false;
    sfx.snap();
  }, 750 + results.length * 90);
  $("rows").innerHTML = "";
  for (const [i, r] of results.entries()) {
    const row = document.createElement("div"), img = document.createElement("img"), name = document.createElement("span"), pts = document.createElement("b");
    img.src = r.thumb || "";
    img.alt = "";
    name.textContent = r.name;
    pts.textContent = r.gain;
    pts.className = r.gain >= 75 ? "hit" : "";
    row.append(img, name, pts);
    row.style.animationDelay = `${300 + i * 90}ms`;
    $("rows").append(row);
  }
}

$("share").onclick = async () => {
  sfx.click();
  const link = `${location.origin}/?beat=${total}` + (params.get("r") ? `&r=${params.get("r")}` : "");
  const text = `I scored ${total} on Hinge Hunt. Beat it: ${link}`;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch {} }
  await navigator.clipboard.writeText(text);
  $("share").textContent = "Copied. Send it";
};

// ---------- making a round from a photo ----------
const STAGE_NAMES = ["Upload the photo", "Build the 3D model", "Find what moves", "Check the motion"];
function stages(now, failed) {
  $("stages").innerHTML = "";
  STAGE_NAMES.forEach((n, i) => {
    const li = document.createElement("li"), em = document.createElement("em");
    li.textContent = n;
    em.textContent = i < now ? "done" : i === now ? (failed ? "failed" : "working") : "next";
    if (i === now) li.className = "now";
    li.append(em);
    $("stages").append(li);
  });
}

for (const input of document.querySelectorAll(".photo")) input.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  show("make");
  hud("Your object");
  $("makeAsk").textContent = "Uploading your photo";
  $("makeHint").textContent = "";
  stages(0);
  try {
    // Shrink to 1024 px JPEG: enough for Lux3D and well under Aholo's 5 MB upload limit.
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    const c = new OffscreenCanvas(Math.round(bmp.width * k), Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const jpeg = await c.convertToBlob({ type: "image/jpeg", quality: 0.9 });
    const made = await api("/api/rounds", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpeg });
    location.search = `?r=${made.id}&s=${made.secret}`;
  } catch (err) {
    $("makeAsk").textContent = "That didn't work";
    $("makeHint").textContent = err.message;
    stages(0, true);
  }
};

const STAGES = { mesh: [1, "Building the 3D model", "Lux3D is turning your photo into a 3D object. About a minute."],
  mechanism: [2, "Finding what moves", "Lux3D is working out the parts and the hinge. About three minutes."] };
async function owner(id, s) {
  show("make");
  hud("Your object");
  const t0 = Date.now();
  for (;;) {
    let r;
    try { r = await api(`/api/rounds/${id}?s=${s}`); } catch (err) { $("makeAsk").textContent = err.message; return; }
    if (r.status === "review") return review(r, s);
    if (r.status === "live") { location.search = `?r=${id}`; return; }
    if (r.status === "failed" || r.status === "discarded") {
      $("makeAsk").textContent = r.status === "failed" ? "Lux3D couldn't do this one" : "Discarded";
      $("makeHint").textContent = r.error || "";
      $("stages").innerHTML = "";
      return;
    }
    const [n, head, hint] = STAGES[r.status];
    stages(n);
    $("makeAsk").textContent = head;
    $("makeHint").textContent = `${hint} You can close this page and come back to this link. ${Math.round((Date.now() - t0) / 1000)} s`;
    await wait(8000);
  }
}

async function review(r, s) {
  place(await loadObject(r));
  swing = 0;
  $("stages").innerHTML = "";
  $("makeAsk").textContent = `Lux3D found the ${partName(obj)}. Is this how it opens?`;
  $("makeHint").textContent = "Players will tap where it pivots, so the motion has to look right.";
  $("reviewRow").hidden = false;
  let flipped = false;
  $("flip").onclick = async () => { flipped = !flipped; place(await loadObject({ ...r, flip: flipped })); swing = 0; };
  const decide = ok => async () => {
    try { await api(`/api/rounds/${r.id}/confirm`, { method: "POST", body: JSON.stringify({ s, ok, flip: flipped }) }); } catch (err) { $("makeHint").textContent = err.message; return; }
    $("reviewRow").hidden = true;
    if (!ok) { $("makeAsk").textContent = "Discarded"; $("makeHint").textContent = ""; return; }
    history.replaceState(null, "", `?r=${r.id}`);
    $("makeAsk").textContent = "It's live";
    $("makeHint").textContent = "Send the link. Your friends get 15 seconds to find the pivot.";
    $("madeRow").hidden = false;
    $("playMine").onclick = () => startRun([r.id]);
    $("copyMine").onclick = async () => { await navigator.clipboard.writeText(`${location.origin}/?r=${r.id}`); $("copyMine").textContent = "Copied"; };
  };
  $("yes").onclick = decide(true);
  $("no").onclick = decide(false);
}

// ---------- title ----------
async function title() {
  show("title");
  const r = params.get("r");
  const { date, rounds } = r ? { date: null, rounds: [r] } : await api("/api/today");
  const when = date && new Date(date + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "short" });
  hud(r ? "1 object" : `${when} · ${rounds.length} objects`);
  const count = ["One", "Two", "Three", "Four", "Five"][rounds.length - 1] ?? rounds.length;
  $("lede").textContent = rounds.length === 1 ? "One object. Find what makes it move." : `${count} objects. Find what makes them move.`;
  $("play").textContent = r ? "Start this hunt" : "Start today's hunt";
  if (params.get("beat")) { $("challenge").hidden = false; $("challenge").textContent = `A friend scored ${params.get("beat")}. Beat it.`; }
  if (!rounds.length) { $("play").disabled = true; return; }
  // The first object turns slowly in the window behind the title plates.
  fetchZip(rounds[0]).then(async () => {
    if (!$("title").hidden) { place(await loadObject(await getRound(rounds[0]))); obj.id = rounds[0]; spin = true; setDown().then(sfx.thunk); }
    for (const id of rounds.slice(1)) { fetchZip(id); getRound(id); } // today's other objects are about 2 MB each: fetch them now so rounds never wait
    if (rounds[1]) prepare(rounds[1]);
  }).catch(() => delete zips[rounds[0]]); // the round retries it
  // The plates swing open on their hinge, then the hunt starts.
  $("play").onclick = () => { sfx.click(); $("plates").classList.add("open"); setTimeout(() => startRun(rounds), 450); };
}

if (params.get("r") && params.get("s")) owner(params.get("r"), params.get("s"));
else title();
</script>
</html>
